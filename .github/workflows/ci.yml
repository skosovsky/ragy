name: CI
on:
  push:
    branches: [main, master, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
env:
  GOWORK: 'off'
  GO_VERSION: '1.27.1'
  LINT_VERSION: '2.14.0'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install pinned linter
        shell: bash
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.LINT_VERSION }}
      # Temporary product dependency, not a test/release runner. Remove after the PDF gate passes.
      - name: Retained PDF backend prerequisites
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ragy-pdf"
          "$RUNNER_TEMP/ragy-pdf/bin/pip" install pdfplumber==0.11.9 pypdf==6.10.0
          echo "RAGY_PDF_PYTHON=$RUNNER_TEMP/ragy-pdf/bin/python" >> "$GITHUB_ENV"
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Integration tests
        run: make test-integration
      - name: End-to-end tests
        run: make test-e2e
