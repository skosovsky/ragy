name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  GOWORK: 'off'
  CGO_ENABLED: '1'
  GO_VERSION: '1.27.2'
  LINT_VERSION: '2.14.0'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'
      - name: Download module dependencies
        shell: bash
        run: |
          make modules | while IFS= read -r module; do
            printf '\n[download] %s\n' "$module"
            (cd "$module" && go mod download all) || exit "$?"
          done
      - name: Install pinned linter
        shell: bash
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.LINT_VERSION }}
      # Required by the retained PDF backend; remove after its Go replacement.
      - name: PDF runtime
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ragy-pdf"
          "$RUNNER_TEMP/ragy-pdf/bin/pip" install pdfplumber==0.11.9 pypdf==6.10.0
          echo "RAGY_PDF_PYTHON=$RUNNER_TEMP/ragy-pdf/bin/python" >> "$GITHUB_ENV"
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Integration tests
        run: make test-integration
      - name: End-to-end tests
        run: make test-e2e
