name: CI
on:
  push:
    branches: [main, master, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
env:
  GOWORK: 'off'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: toolchain
        shell: bash
        run: |
          awk '$1 == "GO_VERSION" {print "go=" $3} $1 == "LINT_VERSION" {print "lint=" $3}' scripts/toolchain.mk >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
      - name: Install pinned linter
        shell: bash
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ steps.toolchain.outputs.lint }}
      # Temporary product dependency, not a test/release runner. Remove after the PDF gate passes.
      - name: Retained PDF backend prerequisites
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ragy-pdf"
          "$RUNNER_TEMP/ragy-pdf/bin/pip" install pdfplumber==0.11.9 pypdf==6.10.0
          echo "RAGY_PDF_PYTHON=$RUNNER_TEMP/ragy-pdf/bin/python" >> "$GITHUB_ENV"
      - name: Full repository check
        run: make check
