name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  GOWORK: "off"

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
      go: ${{ steps.set-matrix.outputs.go }}
      lint: ${{ steps.set-matrix.outputs.lint }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        run: |
          echo "modules=$(python3 scripts/verify.py modules --json)" >> "$GITHUB_OUTPUT"
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          pins = json.load(open("scripts/toolchain.json"))
          print("go=" + pins["go"])
          print("lint=v" + pins["golangci_lint"])
          PYTHON

  lint:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare-matrix.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.prepare-matrix.outputs.go }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ needs.prepare-matrix.outputs.lint }}
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  test:
    name: Test
    needs: [prepare-matrix, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare-matrix.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: true
          go-version: ${{ needs.prepare-matrix.outputs.go }}
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -race ./...

      - name: Compile examples from their owning module
        if: startsWith(matrix.module, 'examples/')
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Compile local onboarding
        if: matrix.module == '.'
        run: go build -o /dev/null ./examples/local-bm25
      - name: Verify tooling contracts
        if: matrix.module == '.'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_test.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_release_consumer_test.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/process_runner_test.py -v

  release-consumer:
    needs: [prepare-matrix, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.prepare-matrix.outputs.go }}
      - name: Exact reviewed candidate with disposable local publication
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_release_consumer.py "$GITHUB_SHA"
