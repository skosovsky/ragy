name: CI

on:
  push:
    branches: ["main", "master", "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

env:
  GOWORK: "off"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          pins = json.load(open('scripts/toolchain.json'))
          print('go=' + pins['go'])
          PY
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.pins.outputs.go }}
      - name: Provision isolated actual parser and PostgreSQL prerequisites
        run: |
          python3 -m venv /tmp/ragy-pdf
          python3 - <<'PY'
          import json, subprocess
          registry = json.load(open('scripts/check-registry.json'))
          subprocess.run(['/tmp/ragy-pdf/bin/pip', 'install', *[name + '==' + version for name, version in registry['pdf'].items()]], check=True)
          subprocess.run(['docker', 'run', '-d', '--name', 'ragy-ci-pg', '--label', 'ragy.task20=T09', '-e', 'POSTGRES_PASSWORD=isolated-test-only', '-e', 'POSTGRES_DB=ragy', registry['postgres_image']], check=True)
          subprocess.run(['docker', 'exec', 'ragy-ci-pg', 'sh', '-c', "until psql -U postgres -d ragy -tAc 'SELECT 1' >/dev/null 2>&1; do sleep 1; done"], timeout=60, check=True)
          subprocess.run(['docker', 'exec', 'ragy-ci-pg', 'psql', '-U', 'postgres', '-d', 'ragy', '-c', 'CREATE EXTENSION vector'], check=True)
          PY
      - name: Canonical full Linux gate
        env:
          RAGY_PDF_PYTHON: /tmp/ragy-pdf/bin/python
          RAGY_PG_TEST_CONTAINER: ragy-ci-pg
        run: python3 scripts/verify.py check --source "$GITHUB_SHA" --output /tmp/ragy-check
      - name: Exact public tag verification
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/check_release_consumer.py "$GITHUB_SHA" --version "${GITHUB_REF_NAME}" --published
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: /tmp/ragy-check
      - name: Remove isolated database
        if: always()
        run: docker rm -f ragy-ci-pg || true
